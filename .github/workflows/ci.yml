name: Auto Build Test

on:
  push:
    branches: [ "bepinex5" ]

jobs:
  build:
    runs-on: windows-latest
    # 这里双重保证权限开启
    permissions:
      contents: write 
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.x
    
    - name: Build
      # 加上 --no-incremental 确保每次都是全新编译
      run: dotnet build --configuration Release --no-incremental

    - name: Create Unique Release
      uses: softprops/action-gh-release@v2
      with:
        # 使用运行编号，确保标签永远是新的（如 v1, v2, v3...），彻底避开 Not Found
        tag_name: "v${{ github.run_number }}"
        name: "Build Release ${{ github.run_number }}"
        draft: false
        prerelease: false
        # 扫描所有生成的 dll 文件并上传
        files: |
          **/bin/Release/**/*.dll
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
