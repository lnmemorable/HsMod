name: Auto Build Test

on:
  push:
    branches: [ "bepinex5" ]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write 
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.x
    
    - name: Build and Publish
      # 直接编译解决方案，并强制把最终的 dll 吐到 MyFinalDLL 这个文件夹里
      run: dotnet publish HsMod.sln --configuration Release -o ./MyFinalDLL

    - name: Create Release and Upload
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "v${{ github.run_number }}"
        name: "Build Release ${{ github.run_number }}"
        # 直接去 MyFinalDLL 文件夹里抓人
        files: ./MyFinalDLL/*.dll
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
