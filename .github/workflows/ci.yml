name: Auto Build Test

on:
  push:
    branches: [ "bepinex5" ]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.x
    
    - name: Build
      run: dotnet build --configuration Release

    # 自动生成一个带时间戳的名字，防止重复冲突
    - name: Set Release Name
      run: echo "REL_TAG=Build-$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_ENV
      shell: bash

    - name: Create Auto Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.REL_TAG }}
        name: Release ${{ env.REL_TAG }}
        draft: false
        prerelease: false
        files: |
          **/*.dll
          !**/obj/**
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
