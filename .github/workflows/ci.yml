name: Auto Build Test

on:
  push:
    branches: [ "bepinex5" ]
  pull_request:
  merge_group:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.x
    
    - name: Restore dependencies
      run: dotnet restore --locked-mode
    
    - name: Build HsMod
      run: dotnet build --configuration Release --no-restore

    # 关键修改：用最宽松的匹配方式找 .dll 文件
    - name: Upload HsMod Artifact
      uses: actions/upload-artifact@v4
      with:
        name: HsMod-Output
        path: |
          **/*.dll
          !**/obj/**

# 编译步骤保持不变...

    - name: Create Release and Upload DLL
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') # 只有你打标签（如 v1.0）推送时才会发布
      with:
        files: |
          **/bin/Release/**/HsMod.dll
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
