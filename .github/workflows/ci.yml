name: Auto Build Test

on:
  push:
    branches: [ "bepinex5" ]
  pull_request:
  merge_group:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.x
    
    - name: Restore dependencies
      run: dotnet restore --locked-mode
    
    - name: Build HsMod
      # 建议确认你的项目输出目录，通常 dotnet build 会生成在 bin/Release 目录下
      run: dotnet build --configuration Release --no-restore

    - name: Upload HsMod to artifact
      uses: actions/upload-artifact@v4
      with:
        name: HsMod.dll
        # 这里最关键！如果你的文件不在这个路径，上传会失败
        # 如果不确定路径，可以改成 **/bin/Release/**/HsMod.dll
        path: |
          **/bin/Release/**/HsMod.dll
        compression-level: 9

  push_to_telegram:
    runs-on: ubuntu-latest
    name: Push to Telegram
    needs: build  # 必须写这个，两个方块才会连起来
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: HsMod.dll  # 对应上面上传的名字
          path: artifacts

      - name: Find Artifacts
        shell: bash
        run: |
          FILE_PATH=$(find artifacts -type f -name 'HsMod.dll' -print -quit)
          echo "HSMOD_FILE=$FILE_PATH" >> $GITHUB_ENV

      - name: Post to Telegram
        env:
          CHAT_ID: ${{ secrets.CHAT_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          MESSAGE_THREAD_ID: ${{ secrets.MESSAGE_THREAD_ID }}
          HSMOD_DLL: ${{ env.HSMOD_FILE }}
          COMMIT_MESSAGE: |+
            New push to GitHub
            ```
            ${{ github.event.head_commit.message }}
            ```by `${{ github.event.head_commit.author.name }}`
            See commit detail [here](${{ github.event.head_commit.url }})
        run: |
          # 使用 Python 进行转义处理，防止 Telegram 报错
          ESCAPED=$(python3 -c 'import json,os,urllib.parse; print(urllib.parse.quote(json.dumps(os.environ["COMMIT_MESSAGE"])))')
          curl -v "https://api.telegram.org/bot${BOT_TOKEN}/sendMediaGroup?chat_id=${CHAT_ID}&message_thread_id=${MESSAGE_THREAD_ID}&media=%5B%7B%22type%22:%22document%22,%20%22media%22:%22attach://canary%22,%22parse_mode%22:%22MarkdownV2%22,%22caption%22:${ESCAPED}%7D%5D" -F canary="@${HSMOD_DLL}"
